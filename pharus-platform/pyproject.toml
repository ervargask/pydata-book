[project]
name = "pharus-platform"
version = "0.1.0"
description = "Pharus: gobernanza E2E de datos, privacidad e IA — scanner de agentes y contratos de privacidad (mockup)"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.7",
  "pydantic-ai-slim>=1.0",
  "fastapi>=0.110",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
pharus = "pharus.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pharus*"]

[tool.setuptools.package-data]
pharus = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
